name: Release from Changelog

# Fires whenever CHANGELOG.md changes on main, or you trigger it by hand.
on:
  push:
    branches: [main]
    paths:
      - 'custom_components/discogs/CHANGELOG.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.2). Leave blank to use the top entry in CHANGELOG.md.'
        required: false
        type: string

permissions:
  contents: write

env:
  CHANGELOG_PATH: custom_components/discogs/CHANGELOG.md
  MANIFEST_PATH: custom_components/discogs/manifest.json

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Pulls the newest version heading out of CHANGELOG.md.
      # A version heading is any ## or ### line whose first token is a
      # version number - that's what tells it apart from nested
      # "### Fixed" / "### Added" / "### Changed" subsection headings.
      - name: Extract version and release notes
        id: changelog
        run: |
          if [ ! -f "$CHANGELOG_PATH" ]; then
            echo "No file at $CHANGELOG_PATH — update the CHANGELOG_PATH env var at the top of this workflow" >&2
            exit 1
          fi

          INPUT_VERSION="${{ inputs.version }}"

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(grep -m 1 -oP '^(##|###)\s+\K[0-9]+\.[0-9]+\.[0-9]+' "$CHANGELOG_PATH")
          fi

          if [ -z "$VERSION" ]; then
            echo "Could not determine a version to release" >&2
            exit 1
          fi
          echo "Releasing version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Pull that version's section out of CHANGELOG.md, wherever it
          # appears in the file — stops at the next real version heading,
          # ignoring nested "### Fixed"/"### Added"/"### Changed" subheadings.
          # Uses (##|###) instead of #{2,3}: Ubuntu's default awk is mawk,
          # which doesn't support {n,m} interval regex.
          awk -v ver="$VERSION" '
            BEGIN {
              gsub(/\./, "\\.", ver)
              start = "^(##|###)[[:space:]]+" ver "([[:space:]]|$)"
            }
            $0 ~ start { grabbing = 1; next }
            grabbing && /^(##|###)[[:space:]]+[0-9]+\.[0-9]+\.[0-9A-Za-z]+/ { exit }
            grabbing { print }
          ' "$CHANGELOG_PATH" > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "No section found in $CHANGELOG_PATH matching version $VERSION" >&2
            exit 1
          fi

      # Builds the badge with the tag baked in, so it always matches
      # whatever version this specific release actually is. This only
      # reflects real installs because hacs.json sets zip_release: true
      # with filename: discogs.zip — HACS downloads that named asset
      # directly instead of the tag's auto-generated source zipball.
      - name: Assemble release body
        run: |
          VERSION="${{ steps.changelog.outputs.version }}"
          {
            cat release_notes.md
            echo ""
            echo "[![GitHub All Releases](https://img.shields.io/github/downloads/trevnologies/ha-discogs-addon/${VERSION}/total.svg)](https://github.com/trevnologies/ha-discogs-addon/releases/${VERSION})"
          } > full_release_body.md

      # Creates the tag only if it doesn't already exist on the remote,
      # so re-running the workflow (or a workflow_dispatch) never moves
      # a tag that's already shipped.
      - name: Create tag if it doesn't exist
        run: |
          VERSION="${{ steps.changelog.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists on origin, leaving it as-is"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${VERSION}"
            git push origin "${VERSION}"
          fi

      # Patches manifest.json's version field to match the release tag,
      # in this ephemeral checkout only — nothing is committed back to
      # main. Keeps the zipped asset's manifest honest even if the
      # committed manifest.json hasn't been bumped yet.
      - name: Sync manifest version for zip
        run: |
          VERSION="${{ steps.changelog.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' "$MANIFEST_PATH" > /tmp/manifest.json
          mv /tmp/manifest.json "$MANIFEST_PATH"

      # Packages custom_components/discogs as the named zip asset that
      # hacs.json's zip_release/filename point at. This is what makes
      # HACS installs/updates hit an actual downloadable GitHub asset
      # instead of the invisible auto-generated source zipball.
      - name: Build release zip
        run: |
          cd custom_components/discogs
          zip -r ../../discogs.zip ./

      # Creates the release if the tag is new, or updates the existing
      # release's notes/badge/asset in place if it's already there.
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.changelog.outputs.version }}
          name: ${{ steps.changelog.outputs.version }}
          body_path: full_release_body.md
          files: discogs.zip
          draft: false
          prerelease: false
