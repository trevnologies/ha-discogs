name: Validate

# Runs on PRs and pushes to main, plus a daily schedule so a HACS or
# hassfest spec change upstream gets caught even if nothing here changed.
# push: is scoped to main (matching codeql.yml) so a push to a PR's own
# branch doesn't ALSO satisfy an unscoped push trigger -- that's what was
# causing Hassfest/HACS to run twice per PR (push + pull_request on the
# same commit).
on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # main, pinned 2026-08-20

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, pinned 2026-08-20
        with:
          category: "integration"
          ignore: "brands"
